<meta name="color-scheme" content="light">
{% seo %}

<script>
  /* Apply the saved theme before first paint (no flash). */
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  })();
</script>
