- date: "Sep 2026"
  text: >-
    <strong>TS-ICL</strong> is accepted at <strong>NeurIPS 2026</strong>: a
    flexible time-indexed foundation model for time series, handling both
    <strong>imputation</strong> and <strong>forecasting</strong> via in-context learning.
  links:
    - label: "paper"
      url: "https://arxiv.org/pdf/2606.05878"
    - label: "code"
      url: "https://github.com/EDF-Lab/ts-icl"

