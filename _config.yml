title: "Etienne Le Naour"
description: >-
  AI Research Scientist at EDF R&D. PhD in Deep Learning from Sorbonne
  University. Deep learning and foundation models for time series.
url: "https://etiennelnr.github.io"
baseurl: ""
lang: en
timezone: Europe/Paris

# ─────────────────────────────────────────────
#  Profile (used in the home page, header & footer)
# ─────────────────────────────────────────────
author:
  name: "Etienne Le Naour"
  role: "AI Research Scientist"
  affiliation: "EDF R&D"
  location: "Paris, France"
  avatar: "/assets/images/bio.jpeg"
  email: "etiennelenaour09@gmail.com"
  links:
    - label: "Email"
      icon: "mail"
      url: "mailto:etiennelenaour09@gmail.com"
    - label: "Google Scholar"
      icon: "scholar"
      url: "https://scholar.google.fr/citations?user=hkQJ3HAAAAAJ&hl=fr"
    - label: "GitHub"
      icon: "github"
      url: "https://github.com/EtienneLnr"
    - label: "LinkedIn"
      icon: "linkedin"
      url: "https://www.linkedin.com/in/etienne-le-naour/"

# ─────────────────────────────────────────────
#  Build
# ─────────────────────────────────────────────
theme: null          # no theme: layouts/CSS live in this repo
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: page
